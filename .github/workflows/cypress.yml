name: Clinic QA Checks
on:
  push:
    branches: [main, develop, portfolio-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_legacy:
        description: 'Chạy thêm bộ kiểm thử cũ chưa xác minh (có thể thất bại)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verified-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cai thu vien backend
        run: npm ci --prefix server
      - name: Cai thu vien frontend
        run: npm ci --prefix client
      - name: Bien dich giao dien
        run: npm run build --prefix client
      - name: Cai Cypress
        run: npm ci --prefix testing/e2e
      - name: Sinh moi truong QA tam thoi
        run: node testing/scripts/prepare-env.js
      - name: Tao tai khoan trong DB thu nghiem
        run: node testing/scripts/seed-test-accounts.js
      - name: Chay backend va frontend
        run: |
          mkdir -p testing/artifacts
          (cd server && nohup npm start > ../testing/artifacts/backend.log 2>&1 &)
          (cd client && nohup npm run dev -- --host 0.0.0.0 > ../testing/artifacts/frontend.log 2>&1 &)
          node testing/scripts/wait-for-app.js
      - name: Kiem thu API dang nhap
        run: node --test --test-concurrency=1 testing/api/auth.test.js
      - name: Kiem thu giao dien dang nhap
        run: npm run cy:smoke --prefix testing/e2e
      - name: Bo kiem thu cu, chi chay khi duoc chon thu cong
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_legacy }}
        run: npm run cy:legacy --prefix testing/e2e
      - name: Luu bao cao va log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-qa-evidence
          path: |
            testing/e2e/cypress/reports/
            testing/e2e/cypress/screenshots/
            testing/e2e/cypress/videos/
            testing/artifacts/
          if-no-files-found: warn
