name: Clinic QA Checks
on:
  push:
    branches: [main, develop, portfolio-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kiem tra test design va RTM
        run: node testing/scripts/audit-qa.js
      - name: Cai thu vien backend
        run: npm ci --prefix server
      - name: Cai thu vien frontend
        run: npm ci --prefix client
      - name: Bien dich giao dien
        run: npm run build --prefix client
      - name: Cai Cypress
        run: npm ci --prefix testing/e2e
      - name: Sinh moi truong QA tam thoi
        run: node testing/scripts/prepare-env.js
      - name: Tao tai khoan trong DB thu nghiem
        run: node testing/scripts/seed-test-accounts.js
      - name: Chay backend va frontend
        run: |
          mkdir -p testing/artifacts
          (cd server && nohup npm start > ../testing/artifacts/backend.log 2>&1 &)
          (cd client && nohup npm run dev -- --host 0.0.0.0 > ../testing/artifacts/frontend.log 2>&1 &)
          node testing/scripts/wait-for-app.js
      - name: API regression va bao cao TAP JUnit
        run: node testing/scripts/run-api.js
      - name: Cypress UI regression (khong retry)
        run: npm run cy:run --prefix testing/e2e
      - name: Tai hien bug dang mo (non-blocking, expected Fail)
        id: known
        continue-on-error: true
        run: node testing/scripts/run-api.js --known-defects
      - name: Ghi ket qua suite vao job summary
        if: always()
        env:
          KNOWN_OUTCOME: ${{ steps.known.outcome }}
        run: |
          echo '## SmileCare QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Regression failures fail the job. Known-defect requirements run separately and are non-blocking.' >> "$GITHUB_STEP_SUMMARY"
          echo "Known-defect step outcome: $KNOWN_OUTCOME. See TAP/JUnit in clinic-qa-evidence; failed requirements are not passes." >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual execution is not performed by this workflow. A green job is not a release-readiness decision.' >> "$GITHUB_STEP_SUMMARY"
      - name: Luu bao cao va log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-qa-evidence
          path: |
            testing/e2e/cypress/reports/
            testing/e2e/cypress/screenshots/
            testing/e2e/cypress/videos/
            testing/artifacts/
          if-no-files-found: warn
