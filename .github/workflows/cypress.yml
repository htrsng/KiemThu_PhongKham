name: Cypress E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./testing/e2e

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/smilecare
      MONGODB_DB: smilecare
      JWT_SECRET: local-ci-only-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./client

      - name: Start Frontend
        run: npm run dev &
        working-directory: ./client

      - name: Install Backend Dependencies
        run: npm install
        working-directory: ./server

      - name: Start Backend
        run: npm start &
        working-directory: ./server

      - name: Install Cypress Dependencies
        run: npm install

      - name: Wait for servers
        run: npx wait-on http://localhost:5173 http://localhost:5000 --timeout 60000

      - name: Run Smoke Tests
        run: npm run cy:smoke

      - name: Run Full E2E Suite
        run: npm run cy:run
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          BASE_URL: http://localhost:5173

      - name: Merge Reports
        if: always()
        run: npm run report:merge && npm run report:gen

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: testing/e2e/cypress/reports/final/

      - name: Upload Videos on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: testing/e2e/cypress/videos/
