name: Clinic QA Checks
on:
  push:
    branches: [main, develop, portfolio-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kiem tra test design va RTM
        run: node .github/qa/scripts/audit-qa.js
      - name: Cai thu vien backend
        run: npm ci --prefix server
      - name: Kiem tra reporting va defect lifecycle
        run: node --test .github/qa/unit/qa-reporting.test.js
      - name: Cai thu vien frontend
        run: npm ci --prefix client
      - name: Bien dich giao dien
        run: npm run build --prefix client
      - name: Cai Cypress
        run: npm ci --prefix automation-testing
      - name: Cai Newman
        run: npm ci --prefix api-testing/postman
      - name: Sinh moi truong QA tam thoi
        run: node .github/qa/scripts/prepare-env.js
      - name: Tao tai khoan trong DB thu nghiem
        run: node .github/qa/scripts/seed-test-accounts.js
      - name: Chay backend va frontend
        run: |
          mkdir -p automation-testing/reports/generated
          (cd server && nohup npm start > ../automation-testing/reports/generated/backend.log 2>&1 &)
          (cd client && nohup npm run dev -- --host 0.0.0.0 > ../automation-testing/reports/generated/frontend.log 2>&1 &)
          node .github/qa/scripts/wait-for-app.js
      - name: Full QA run (API, defect regression, Cypress)
        id: qa
        run: node .github/qa/scripts/run-qa.js
      - name: Kiem tra ket qua va evidence cua run
        if: always() && steps.qa.outputs.run_dir != ''
        env:
          QA_AUDIT_DIR: ${{ steps.qa.outputs.run_dir }}
        run: node .github/qa/scripts/audit-run.js "$QA_AUDIT_DIR"
      - name: Postman collection via Newman
        if: always() && steps.qa.outputs.run_dir != ''
        run: node .github/qa/scripts/run-postman.js
      - name: Luu bao cao va log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-qa-evidence
          path: |
            automation-testing/reports/generated/
          if-no-files-found: warn
